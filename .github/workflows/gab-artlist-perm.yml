name: gab-artlist-perm
on:
  workflow_dispatch:
permissions: read-all
jobs:
  t:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: list
        uses: actions/github-script@v7
        with:
          script: |
            try { const r = await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId}); console.log("OK count=" + r.data.total_count); }
            catch(e){ console.log("FAIL " + e.status + " " + e.message); }
      - name: checkout
        id: co
        continue-on-error: true
        uses: actions/checkout@v4
      - name: report
        if: always()
        run: echo "checkout_outcome=${{ steps.co.outcome }}"
