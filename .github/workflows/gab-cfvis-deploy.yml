name: "GAB CFVis Deploy"
on:
  workflow_run:
    workflows: ["GAB CFVis Build"]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
jobs:
  deploy:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cfvis-payload
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-artifact
      - name: Show
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA checked_out_after_no_checkout=$PWD"
          cat downloaded-artifact/pr_number.txt
          cat downloaded-artifact/public/index.html
