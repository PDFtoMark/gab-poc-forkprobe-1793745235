name: gab-chk-producer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p out/surefire-reports && printf '<testsuite name="a" tests="1"><testcase name="t" classname="c"/></testsuite>' > out/surefire-reports/TEST-a.xml
      - uses: actions/upload-artifact@v4
        with:
          name: surefire-fake-test-results
          path: out
