name: OpenAPI Generator Test Report

on:
  workflow_run:
    workflows: ['OpenAPI Generator']
    types:
      - completed

# separate workflow required due to https://github.com/dorny/test-reporter#recommended-setup-for-public-repositories
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: surefire-test-results
          name: JUnit Test results
          path: '**/surefire-reports/TEST-*.xml'
          reporter: java-junit
      - name: probe
        if: always()
        run: |
          echo "INJ_VAR=[${INJ_VAR:-unset}]"
          test -e /tmp/pwned-by-artifact && echo RCE-TOUCH || echo no-touch
          test -e /tmp/pwned-backtick && echo RCE-BACKTICK || echo no-backtick
          echo "summary files:"; ls -la "$RUNNER_TEMP"/test-reporter-summary-* 2>/dev/null || true
