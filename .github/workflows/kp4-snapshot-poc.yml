name: kp4-snapshot-poc
# Mirror of canva-public/karpenter-provider-aws .github/workflows/snapshot-pr.yaml
# (same permissions block, same step order, same local-action checkout pattern).
on:
  workflow_run:
    workflows:
      - ApprovalComment
    types:
      - completed

jobs:
  snapshot:
    permissions:
      id-token: write
      pull-requests: write
      statuses: write
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/kp-dl
      - id: metadata
        run: |
          pr_number="$(head -n 2 /tmp/artifacts/metadata.txt | tail -n 1)"
          pr_commit="$(tail -n 1 /tmp/artifacts/metadata.txt)"
          echo PR_COMMIT="$pr_commit" >> "$GITHUB_ENV"
          echo PR_NUMBER="$pr_number" >> "$GITHUB_ENV"
          echo "META pr=$pr_number commit=$pr_commit"
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.PR_COMMIT }}
      - name: show checked out commit
        run: |
          echo "WORKSPACE_HEAD=$(git rev-parse HEAD)"
          echo "TREE_ACTION_FILE:"; head -3 .github/actions/kp-status/action.yaml
      - uses: ./.github/actions/kp-status
      - name: token capability probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PROBE_PR_NUMBER=$PR_NUMBER"
          gh api "repos/${{ github.repository }}" --jq '"REPO_READ_OK " + .full_name' || echo REPO_READ_FAILED
          gh api -X POST "repos/${{ github.repository }}/statuses/${PR_COMMIT}" \
            -f state=success -f context=kp-poc-status -f description=poc >/dev/null && echo STATUS_WRITE_OK || echo STATUS_WRITE_FAILED
