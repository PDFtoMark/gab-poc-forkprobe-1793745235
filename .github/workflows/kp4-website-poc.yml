name: kp4-website-poc
# Mirror of canva-public/karpenter-provider-aws .github/workflows/website-preview.yaml
on:
  workflow_run:
    workflows: [ WebsitePreviewTrigger ]
    types: [ completed ]

jobs:
  preview:
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/kp-dl
      - id: website-metadata
        run: |
          pr_number="$(head -n 1 /tmp/artifacts/website-metadata.txt)"
          pr_commit="$(tail -n 1 /tmp/artifacts/website-metadata.txt)"
          {
            echo PR_COMMIT="$pr_commit"
            echo PR_NUMBER="$pr_number"
            echo BRANCH_NAME="pr-$pr_number"
          } >> "$GITHUB_ENV"
          echo "WMETA pr=$pr_number commit=$pr_commit"
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.PR_COMMIT }}
      - name: show checked out commit
        run: echo "WORKSPACE_HEAD=$(git rev-parse HEAD)"
      - uses: ./.github/actions/kp-status
      - name: token capability probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ env.PR_COMMIT }}" \
            -f state=success -f context=kp-poc-website-status -f description=poc >/dev/null && echo STATUS_WRITE_OK || echo STATUS_WRITE_FAILED
